; hhj-sensor v2.1 — PlatformIO around a flat layout
; (hhj-sensor.ino + *.h in this folder, host tests in test/).
;
;   pio run -e finish -t upload   # FINISH gate (default env)
;   pio run -e start  -t upload   # START gate — same code, no edits
;   pio device monitor            # 115200 — run it FROM THIS FOLDER (or pass -b 115200):
;                                 # without this platformio.ini pio assumes 9600 = garbage
;
; From the repo root the same things are `make flash-finish`, `make flash-start`,
; `make monitor-sensor`, and `make test-firmware` for the host tests.
;
; VS Code: open hobbyhorsejumping.code-workspace in the repo root — PlatformIO
; IDE only sees a platformio.ini in the root of a workspace folder. Pick the
; env in the status bar.
;
; Overrides without touching the code go into build_flags of an env:
;   -D PIN_BEAM_A=5 -D HHJ_WIFI_PRIMARY_SSID='"x"' -D HHJ_WIFI_PRIMARY_PASS='"y"'
; The fallback WiFi lives in ../hhj-common/include/hhj/wifi_secrets.h (git-ignored).

[platformio]
default_envs = finish
src_dir = .

[env]
; pinned: the same toolchain and Arduino core (3.3.x) as hhj-timer
platform = https://github.com/platformio/platform-espressif32/archive/refs/tags/v8.0.0.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_src_filter = +<*> -<.pio/> -<test/>
build_flags = -I${PROJECT_DIR}/../hhj-common/include

[env:finish]
build_flags = ${env.build_flags} -D GATE_MODE='"FINISH"'

[env:start]
build_flags = ${env.build_flags} -D GATE_MODE='"START"'
