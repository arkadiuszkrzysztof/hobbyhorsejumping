; hhj-timer — XIAO ESP32-C3 + 4x TPIC6B595
; env "stoper" = the real firmware
; env "test"   = soldering test: every segment in turn, then 0-9, then 1234
;
;   pio run -e stoper -t upload
;   pio run -e test   -t upload
;   pio device monitor
;
; From the repo root: `make flash-timer`, `make flash-timer-test`,
; `make monitor-timer`, and `make test-firmware` for the host tests.
;
; WiFi: ../hhj-common/include/hhj/wifi_config.h (shared with the gates).
[platformio]
default_envs = stoper

[env]
platform = https://github.com/platformio/platform-espressif32/archive/refs/tags/v8.0.0.zip
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags = -I${PROJECT_DIR}/../hhj-common/include

[env:stoper]
build_flags = ${env.build_flags} -D TEST_MODE=0

[env:test]
build_flags = ${env.build_flags} -D TEST_MODE=1
